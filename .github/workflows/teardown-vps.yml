name: Teardown VPS

# 一次性拆除：把公网部署清干净，只保留 GitHub 仓库。
#
# 为什么是工作流而不是手动 SSH：这台机器的部署本来就是通过 `Deploy VPS`
# 用 `VPS_*` secrets + sshpass 完成的；拆除走同一条通道最不容易出错，
# 而且**过程本身留档**（这个文件就是"当初怎么下线的"的记录）。
#
# 它会做四件事，每一步都先打印再执行：
#   1. 读容器标签拿到 compose 项目名与工作目录（容器删掉后就读不到了，所以先读）；
#   2. `docker compose down -v --remove-orphans` 停服务、删网络与**数据卷**；
#   3. 删掉工作目录与 /opt/zhihu-multiverse-releases 下的全部发行快照；
#   4. 只在**确实引用本域名**的 nginx 配置文件上做 disable（先 nginx -t 再 reload）。
#
# 之后服务器上不再有任何本项目的东西；代码仍在 GitHub 仓库里。

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  teardown:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Validate teardown secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_PORT"
          test -n "$VPS_USER"
          test -n "$VPS_PASSWORD"

      - name: Install SSH client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sshpass

      - name: Trust current server host key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Tear down the deployment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -Eeuo pipefail
          export SSHPASS="$VPS_PASSWORD"
          sshpass -e ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'DOMAIN=zhihu.xuanyi888.cloud bash -se' <<'REMOTE'
          set -Eeuo pipefail

          container="zhihu-multiverse"
          release_root="/opt/zhihu-multiverse-releases"

          echo "== 1. 读取容器标签（必须删容器之前读） =="
          if docker inspect "$container" >/dev/null 2>&1; then
            compose_project="$(docker inspect "$container" --format '{{ index .Config.Labels "com.docker.compose.project" }}' || true)"
            current_dir="$(docker inspect "$container" --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' || true)"
            echo "compose 项目：${compose_project:-（空）}"
            echo "工作目录：${current_dir:-（空）}"

            # 幂等性：`docker compose down` 之后容器可能还残留、但 compose 标签已经没了。
            # 这时"空目录"不是越权，只是"没有可清理的 compose 工程"，直接删容器即可。
            if [ -n "$compose_project" ] && [ -n "$current_dir" ]; then
              # 与部署脚本同样的白名单：只允许操作我们自己的目录
              case "$current_dir" in
                /opt/zhihu-multiverse|/opt/zhihu-multiverse-*|/opt/zhihu-multiverse-releases/*) ;;
                *)
                  echo "拒绝操作未授权的目录：$current_dir"
                  exit 1
                  ;;
              esac

              echo "== 2. 停服务并删除数据卷 =="
              cd "$current_dir"
              docker compose -p "$compose_project" down -v --remove-orphans || true
            else
              echo "容器存在但缺少 compose 标签（说明上一轮已 down 过）→ 直接删除该容器"
              docker rm -f "$container" || true
            fi
          else
            echo "容器不存在（可能已删过）：跳过 compose down"
            current_dir=""
          fi

          echo "== 3. 删除工作目录与全部发行快照 =="
          if [ -n "$current_dir" ]; then
            rm -rf -- "$current_dir"
            echo "已删除：$current_dir"
          fi
          rm -rf -- "$release_root"
          echo "已删除：$release_root"

          echo "== 4. 摘掉引用本域名的 nginx 站点配置 =="
          if command -v nginx >/dev/null 2>&1; then
            touched=0
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              target="${file}.disabled-by-teardown"
              mv -- "$file" "$target"
              echo "已停用：$file -> $target"
              touched=$((touched + 1))
            done < <(grep -rl -- "$DOMAIN" /etc/nginx 2>/dev/null || true)

            if [ "$touched" -gt 0 ]; then
              if nginx -t; then
                systemctl reload nginx || service nginx reload || true
                echo "nginx 已重载"
              else
                echo "nginx 配置校验失败 —— 回滚所有改动"
                for f in $(grep -rl -- "disabled-by-teardown" /etc/nginx 2>/dev/null || true); do
                  mv -- "$f" "${f%.disabled-by-teardown}"
                done
                nginx -t && (systemctl reload nginx || true)
                exit 1
              fi
            else
              echo "没有找到引用 $DOMAIN 的 nginx 配置（可能已在别处托管）"
            fi
          else
            echo "本机没有 nginx，跳过"
          fi

          echo "== 5. 收尾：确认没有残留进程与目录 =="
          docker ps -a --filter "name=$container" --format '{{.Names}} {{.Status}}' || true
          ls -la /opt || true
          echo "拆除完成。"
          REMOTE

      # 第二轮：把 nginx 这一层也清掉，并且**把现场打出来**（否则只能看到 502，无从判断原因）。
      # 与第一步一样是幂等的：可以反复执行。
      - name: Deep clean (nginx + listeners)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -Eeuo pipefail
          export SSHPASS="$VPS_PASSWORD"
          sshpass -e ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'DOMAIN=zhihu.xuanyi888.cloud bash -se' <<'REMOTE'
          set -Eeuo pipefail

          echo "== A. 谁在监听 443 / 8443 =="
          (ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null) | grep -E ':(443|8443)\b' || echo "  （没有进程监听 443/8443）"

          echo "== B. /etc/nginx 下引用本域名（或 xuanyi888）的文件 =="
          grep -rl -- 'xuanyi888' /etc/nginx 2>/dev/null || echo "  （/etc/nginx 里没有匹配）"

          echo "== C. 站点目录列表（判断是否只有我们一个站点）=="
          ls -la /etc/nginx/sites-enabled 2>/dev/null || true
          ls -la /etc/nginx/conf.d 2>/dev/null || true

          echo "== D. 停用匹配到的站点配置（先备份改名，再校验，失败自动回滚）=="
          touched=0
          for file in $(grep -rl -- 'xuanyi888' /etc/nginx 2>/dev/null || true); do
            case "$file" in
              *.disabled-by-teardown) continue ;;
            esac
            mv -- "$file" "${file}.disabled-by-teardown"
            echo "  已停用：$file"
            touched=$((touched + 1))
          done

          if [ "$touched" -gt 0 ]; then
            if nginx -t; then
              systemctl reload nginx || service nginx reload || true
              echo "  nginx 已重载"
            else
              echo "  nginx -t 校验失败 → 回滚全部改动"
              for f in $(grep -rl 'disabled-by-teardown' /etc/nginx 2>/dev/null || true); do
                mv -- "$f" "${f%.disabled-by-teardown}"
              done
              nginx -t || true
              exit 1
            fi
          else
            echo "  没有可停用的匹配文件"
          fi

          echo "== E. 重载后的本机响应（期望：无响应 / 404 / 连接被拒，而不是 502）=="
          curl -s -o /dev/null -w '  443  → HTTP %{http_code}\n' -k --max-time 8 https://127.0.0.1/ || echo "  443  → 无响应"
          curl -s -o /dev/null -w '  8443 → HTTP %{http_code}\n' -k --max-time 8 https://127.0.0.1:8443/ || echo "  8443 → 无响应"

          echo "== F. 域名解析仍指向本机（DNS 记录需要域名持有者自行删除）=="
          host "$DOMAIN" 2>/dev/null || getent hosts "$DOMAIN" || true

          echo "深层清理完成。"
          REMOTE

      # 第三轮：nginx 那一层需要 root（前一轮的 grep/ls 被权限挡了，所以"无匹配"是假象），
      # 另外 /opt 下还留着工作目录与几十份 .env.production 备份（**里面有真实凭据**）必须清掉。
      - name: Deep clean with sudo (nginx config + leftover credentials)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -Eeuo pipefail
          export SSHPASS="$VPS_PASSWORD"
          sshpass -e ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'DOMAIN=zhihu.xuanyi888.cloud bash -se' <<'REMOTE'
          set -Eeuo pipefail

          # 免密 sudo 可用才动系统配置；否则只报告，绝不瞎试
          if sudo -n true 2>/dev/null; then
            SUDO="sudo -n"
            echo "== 1. 用 nginx -T 打印**生效配置**并定位本域名（这才是定论手段）=="
            # 之前用 `grep -r` 一直"无匹配"：`-r` 不跟随符号链接，而站点配置常常是 conf.d 下的软链。
            # `nginx -T` 会把 include 展开后的全部配置打出来，来源无处可藏。
            $SUDO nginx -T 2>/dev/null | grep -n -- 'xuanyi888' | head -20 || echo "  （生效配置里确实没有本域名）"

            echo "-- 软链也要跟（grep -R）--"
            $SUDO grep -Rl -- 'xuanyi888' /etc/nginx 2>/dev/null || echo "  （-R 也没有匹配）"

            echo "-- sites-enabled / conf.d 实际内容（含符号链接指向）--"
            $SUDO ls -la /etc/nginx/sites-enabled 2>/dev/null || true
            $SUDO ls -la /etc/nginx/conf.d 2>/dev/null || true
            $SUDO ls -la /etc/nginx 2>/dev/null | head -20 || true

            touched=0
            # 只停用"确凿引用本域名"的文件；`nginx -T` 打出的来源路径优先
            for file in $($SUDO grep -Rl -- 'xuanyi888' /etc/nginx 2>/dev/null || true); do
              case "$file" in *.disabled-by-teardown) continue ;; esac
              $SUDO mv -- "$file" "${file}.disabled-by-teardown"
              echo "  已停用：$file"
              touched=$((touched + 1))
            done

            if [ "$touched" -gt 0 ]; then
              if $SUDO nginx -t; then
                $SUDO systemctl reload nginx || true
                echo "  nginx 已重载"
              else
                echo "  nginx -t 失败 → 回滚"
                for f in $($SUDO grep -rl 'disabled-by-teardown' /etc/nginx 2>/dev/null || true); do
                  $SUDO mv -- "$f" "${f%.disabled-by-teardown}"
                done
                $SUDO nginx -t || true
                exit 1
              fi
            fi

            echo "== 2. 重载后端口状态（期望：443/8443 不再有 nginx 监听，或只剩默认站点）=="
            (ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null) | grep -E ':(443|8443)\b' || echo "  （已无进程监听 443/8443）"
          else
            echo "⚠️ 免密 sudo 不可用：跳过 nginx 配置清理（需要你手动处理，见最后提示）"
          fi

          echo "== 3. 清掉 /opt 下残留的工作目录与凭据备份 =="
          # 这些文件里有真实密钥（APP_LLM_API_KEY / ZHIHU_* / OAuth），不能留在机器上
          removed=0
          for pattern in \
            /opt/zhihu-multiverse \
            /opt/zhihu-multiverse-releases \
            /opt/_staging \
            /opt/_upload.tar.gz \
            /opt/.env.production.bak-* \
            /opt/.env.before-* \
            /opt/.rollback-image-*.txt \
            /opt/.last-deploy-stamp \
            /opt/build*.log
          do
            for target in $pattern; do
              [ -e "$target" ] || continue
              if sudo -n rm -rf -- "$target" 2>/dev/null || rm -rf -- "$target" 2>/dev/null; then
                echo "  已删除：$target"
                removed=$((removed + 1))
              else
                echo "  删除失败（权限）：$target"
              fi
            done
          done
          echo "  共删除 $removed 项"

          echo "== 4. 收尾：/opt 现状 =="
          ls -la /opt || true
          echo "== 5. 端口最终状态 =="
          (ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null) | grep -E ':(80|443|8443)\b' || echo "  （80/443/8443 均无监听）"
          echo "全部清理完成。"
          REMOTE
