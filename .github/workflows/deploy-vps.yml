name: Deploy VPS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Validate deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_PORT"
          test -n "$VPS_USER"
          test -n "$VPS_PASSWORD"

      - name: Install SSH client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sshpass

      - name: Trust current server host key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Update existing Docker deployment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -Eeuo pipefail
          export SSHPASS="$VPS_PASSWORD"
          sshpass -e ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          container="zhihu-multiverse"
          project_dir="$(docker inspect "$container"             --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}')"

          if [ -z "$project_dir" ] || [ ! -d "$project_dir/.git" ]; then
            echo "无法从现有容器识别 Git 仓库目录。"
            exit 1
          fi

          cd "$project_dir"

          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "服务器仓库有未提交的已跟踪文件改动；为避免覆盖，停止部署。"
            git status --short --untracked-files=no
            exit 1
          fi

          git fetch origin main
          git checkout main
          git merge --ff-only origin/main
          docker compose up -d --build
          docker compose ps

          for attempt in $(seq 1 20); do
            health="$(docker inspect "$container"               --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}')"
            if [ "$health" = "healthy" ]; then
              echo "部署完成，容器健康检查通过。"
              exit 0
            fi
            if [ "$health" = "unhealthy" ]; then
              docker compose logs --tail=100 web
              exit 1
            fi
            sleep 3
          done

          echo "容器未在规定时间内进入 healthy。"
          docker compose logs --tail=100 web
          exit 1
          REMOTE
