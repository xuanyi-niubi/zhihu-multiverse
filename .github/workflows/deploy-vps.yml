name: Deploy VPS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    steps:
      - name: Validate deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_PORT"
          test -n "$VPS_USER"
          test -n "$VPS_PASSWORD"

      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Install SSH and rsync clients
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sshpass rsync

      - name: Trust current server host key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Prepare incremental release on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -Eeuo pipefail
          export SSHPASS="$VPS_PASSWORD"
          sshpass -e ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "RELEASE_SHA='$GITHUB_SHA' bash -se" <<'REMOTE'
          set -Eeuo pipefail

          container="zhihu-multiverse"
          current_dir="$(docker inspect "$container" --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}')"
          release_root="/opt/zhihu-multiverse-releases"
          release_dir="$release_root/$RELEASE_SHA"

          # --delete 只允许作用于这个专用发布目录，绝不直接改当前运行目录。
          case "$current_dir" in
            /opt/zhihu-multiverse|/opt/zhihu-multiverse-*|/opt/zhihu-multiverse-releases/*) ;;
            *)
              echo "拒绝使用未授权的项目目录：$current_dir"
              exit 1
              ;;
          esac

          if ! command -v rsync >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends rsync
          fi

          mkdir -p "$release_root"
          if [ -e "$release_dir" ]; then
            rm -rf -- "$release_dir"
          fi
          mkdir -p "$release_dir"

          # 先用硬链接复制当前版本，几乎不占额外空间；随后只接收变化文件。
          rsync -a --link-dest="$current_dir" \
            --exclude="/.git/" \
            --exclude="/node_modules/" \
            --exclude="/.next/" \
            --exclude="/data/" \
            "$current_dir/" "$release_dir/"
          REMOTE

      - name: Sync changed files over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -Eeuo pipefail
          export SSHPASS="$VPS_PASSWORD"
          release_dir="/opt/zhihu-multiverse-releases/$GITHUB_SHA"
          sshpass -e rsync -azc --delete-delay \
            --exclude="/.git/" \
            --exclude="/node_modules/" \
            --exclude="/.next/" \
            --exclude="/data/" \
            --exclude="/.env" \
            --exclude="/.env.local" \
            --exclude="/.env.production" \
            -e "ssh -p $VPS_PORT" \
            ./ "$VPS_USER@$VPS_HOST:$release_dir/"

      - name: Build and activate release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -Eeuo pipefail
          export SSHPASS="$VPS_PASSWORD"
          sshpass -e ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "RELEASE_SHA='$GITHUB_SHA' bash -se" <<'REMOTE'
          set -Eeuo pipefail

          container="zhihu-multiverse"
          release_dir="/opt/zhihu-multiverse-releases/$RELEASE_SHA"
          compose_project="$(docker inspect "$container" --format '{{ index .Config.Labels "com.docker.compose.project" }}')"

          test -n "$compose_project"
          test -f "$release_dir/docker-compose.yml"
          test -f "$release_dir/.env.production"

          cd "$release_dir"
          docker compose -p "$compose_project" up -d --build
          docker compose -p "$compose_project" ps

          for attempt in $(seq 1 30); do
            health="$(docker inspect "$container" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}')"
            if [ "$health" = "healthy" ]; then
              echo "部署完成：${RELEASE_SHA}"
              echo "容器健康检查通过。"
              exit 0
            fi
            if [ "$health" = "unhealthy" ]; then
              docker compose -p "$compose_project" logs --tail=120 web
              exit 1
            fi
            sleep 3
          done

          echo "容器未在规定时间内进入 healthy。"
          docker compose -p "$compose_project" logs --tail=120 web
          exit 1
          REMOTE
