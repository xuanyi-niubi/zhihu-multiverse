name: Deploy VPS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    steps:
      - name: Validate deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_PORT"
          test -n "$VPS_USER"
          test -n "$VPS_PASSWORD"

      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Build release archive
        run: |
          set -Eeuo pipefail
          tar \
            --exclude="./.git" \
            --exclude="./node_modules" \
            --exclude="./.next" \
            --exclude="./.env" \
            --exclude="./.env.local" \
            --exclude="./.env.production" \
            -czf "/tmp/zhihu-multiverse-${GITHUB_SHA}.tar.gz" .

      - name: Install SSH client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sshpass

      - name: Trust current server host key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload release over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -Eeuo pipefail
          export SSHPASS="$VPS_PASSWORD"
          sshpass -e scp -P "$VPS_PORT" \
            "/tmp/zhihu-multiverse-${GITHUB_SHA}.tar.gz" \
            "$VPS_USER@$VPS_HOST:/tmp/zhihu-multiverse-${GITHUB_SHA}.tar.gz"

      - name: Activate release on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -Eeuo pipefail
          export SSHPASS="$VPS_PASSWORD"
          sshpass -e ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "RELEASE_SHA='$GITHUB_SHA' bash -se" <<'REMOTE'
          set -Eeuo pipefail

          container="zhihu-multiverse"
          archive="/tmp/zhihu-multiverse-${RELEASE_SHA}.tar.gz"
          current_dir="$(docker inspect "$container" --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}')"
          compose_project="$(docker inspect "$container" --format '{{ index .Config.Labels "com.docker.compose.project" }}')"
          release_dir="/opt/zhihu-multiverse-releases/${RELEASE_SHA}"

          if [ -z "$current_dir" ] || [ ! -d "$current_dir" ]; then
            echo "无法从现有容器识别 Docker Compose 项目目录。"
            exit 1
          fi

          if [ -z "$compose_project" ]; then
            echo "无法识别现有 Docker Compose 项目名称。"
            exit 1
          fi

          if [ ! -f "$archive" ]; then
            echo "服务器未收到发布包：$archive"
            exit 1
          fi

          mkdir -p "$release_dir"
          tar -xzf "$archive" -C "$release_dir"
          rm -f "$archive"

          # 运行时配置不进入发布包，只从当前健康部署迁移到新版本。
          for env_file in .env .env.local .env.production; do
            if [ -f "$current_dir/$env_file" ]; then
              install -m 600 "$current_dir/$env_file" "$release_dir/$env_file"
            fi
          done

          cd "$release_dir"
          docker compose -p "$compose_project" up -d --build
          docker compose -p "$compose_project" ps

          for attempt in $(seq 1 30); do
            health="$(docker inspect "$container" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}')"
            if [ "$health" = "healthy" ]; then
              echo "部署完成：${RELEASE_SHA}"
              echo "容器健康检查通过。"
              exit 0
            fi
            if [ "$health" = "unhealthy" ]; then
              docker compose -p "$compose_project" logs --tail=120 web
              exit 1
            fi
            sleep 3
          done

          echo "容器未在规定时间内进入 healthy。"
          docker compose -p "$compose_project" logs --tail=120 web
          exit 1
          REMOTE
